<canvas id="shader-canvas-ANIMATION_3" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_3');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;

varying vec2 v_texCoord;

void main() {
    vec2 uv = v_texCoord;
    
    // Deep navy background base
    vec3 color = vec3(0.039, 0.098, 0.184); // #0a192f
    
    // Dynamic organic flow (mist/clouds)
    float noise = sin(uv.x * 3.0 + u_time * 0.2) * cos(uv.y * 2.0 - u_time * 0.1);
    noise += sin(uv.y * 5.0 + u_time * 0.3) * cos(uv.x * 4.0 + u_time * 0.2) * 0.5;
    
    // Atmospheric golden glow
    vec3 glowColor = vec3(0.804, 0.498, 0.196); // Bronze gold
    float glow = smoothstep(0.3, 0.8, noise);
    
    color = mix(color, color + glowColor * 0.1, glow);
    
    // Subtle vignette
    float dist = distance(uv, vec2(0.5));
    color *= 1.0 - smoothstep(0.5, 1.2, dist);
    
    gl_FragColor = vec4(color, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<div id="threejs-container-ANIMATION_4" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_4');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, (container.clientWidth || window.innerWidth) / (container.clientHeight || window.innerHeight), 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(container.clientWidth || window.innerWidth, container.clientHeight || window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const sunLight = new THREE.DirectionalLight(0xffcc88, 1.2);
sunLight.position.set(10, 20, 10);
sunLight.castShadow = true;
scene.add(sunLight);

// Tabletop Board (The Kingdom)
const boardGeometry = new THREE.BoxGeometry(12, 0.5, 6);
const boardMaterial = new THREE.MeshPhongMaterial({ color: 0x220e07 }); // Dark surface
const board = new THREE.Mesh(boardGeometry, boardMaterial);
board.receiveShadow = true;
scene.add(board);

// Create Cells (10 small, 2 large)
const createCell = (x, z, color, label) => {
    const geometry = new THREE.BoxGeometry(1.8, 0.2, 1.8);
    const material = new THREE.MeshPhongMaterial({ color: color, transparent: true, opacity: 0.8 });
    const cell = new THREE.Mesh(geometry, material);
    cell.position.set(x, 0.36, z);
    scene.add(cell);
};

// Player cells (Bottom row)
for(let i = -2; i <= 2; i++) {
    createCell(i * 2, 1.2, 0x0277BD); // Deep blue for player
}

// Enemy cells (Top row)
for(let i = -2; i <= 2; i++) {
    createCell(i * 2, -1.2, 0x8B0000); // Earth red for enemy
}

// Citadel (The 'Quan' cells)
const createCitadel = (x, color) => {
    const geometry = new THREE.CylinderGeometry(1.5, 1.5, 1, 32);
    const material = new THREE.MeshPhongMaterial({ color: color });
    const citadel = new THREE.Mesh(geometry, material);
    citadel.position.set(x, 0.5, 0);
    scene.add(citadel);
    
    // Add a simple flag pole
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2), new THREE.MeshPhongMaterial({color: 0x888888}));
    pole.position.set(x, 2, 0);
    scene.add(pole);
};

createCitadel(-6, 0xCD7F32); // Player Capital (Đại Thành)
createCitadel(6, 0x8B0000);  // Enemy Capital (Địch Thành)

camera.position.set(0, 10, 8);
camera.lookAt(0, 0, 0);

function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});
})();
</script>

<script>
        // Subtle Parallax Effect for the Landing Screen
        document.addEventListener('mousemove', (e) => {
            const container = document.getElementById('parallax-container');
            const inner = document.getElementById('parallax-content');
            if(!container || !inner) return;

            const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 50;

            inner.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.getElementById('parallax-container')?.addEventListener('mouseleave', () => {
            const inner = document.getElementById('parallax-content');
            if(inner) {
                inner.style.transform = `rotateY(0deg) rotateX(0deg)`;
                inner.style.transition = 'transform 0.5s ease-out';
            }
        });
        
        document.getElementById('parallax-container')?.addEventListener('mouseenter', () => {
            const inner = document.getElementById('parallax-content');
            if(inner) {
                inner.style.transition = 'none';
            }
        });

        // Add keyframes for shimmer effect dynamically
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes shimmer {
                100% {
                    transform: translateX(100%);
                }
            }
        `;
        document.head.appendChild(styleSheet);
    </script>
